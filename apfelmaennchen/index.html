<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=overlays-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apfelmännchen" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#09111d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>Apfelmännchen – Zoom-Reise</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 10%, #15345c, #050913 60%, #02040a 100%);
      color: #eef4ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at center, transparent 0 42%, rgba(0,0,0,0.08) 70%, rgba(0,0,0,0.35) 100%);
    }
    .hud {
      position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top));
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
      pointer-events: none;
    }
    .bottom {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-end;
      pointer-events: none;
    }
    .card {
      background: rgba(8,14,28,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
      padding: 14px 16px;
      pointer-events: auto;
    }
    .title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .small, .status { color: #b8c7df; font-size: 13px; line-height: 1.35; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .fullscreen-toggle {
      position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left)); top: calc(max(12px, env(safe-area-inset-top)) + 86px);
      padding: 8px 11px; min-height: 0; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(238,244,255,0.9); color: #08111f; font-size: 12px; font-weight: 900; line-height: 1;
      box-shadow: 0 7px 18px rgba(0,0,0,0.22);
    }
    .fullscreen-toggle:active { transform: translateY(2px); }
    .standalone .fullscreen-toggle { display: none; }
    @media all and (display-mode: fullscreen), all and (display-mode: standalone) { .fullscreen-toggle { display:none; } }
    a, button, input[type="range"] { pointer-events: auto; }
    button, .nav-link {
      appearance: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      min-height: 44px; padding: 10px 14px; background: rgba(255,255,255,0.08);
      color: #eef4ff; font-size: 15px; font-weight: 600; touch-action: manipulation;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none;
    }
    button.primary { background: rgba(120,212,255,0.16); }
    button.secondary, .nav-link { background: rgba(255,190,114,0.16); }
    .slider { display: flex; align-items: center; gap: 10px; }
    .slider span { color: #b8c7df; font-size: 13px; }
    input[type="range"] { width: 140px; accent-color: #78d4ff; }
    progress { width: 140px; height: 10px; }
    .status { max-width: 66ch; }
    @media (max-width: 820px) {
      .hud, .bottom { flex-direction: column; }
      .controls { justify-content: flex-start; }
      .status { max-width: none; }
    }
  </style>
</head>
<body>
  <button id="fullscreenToggle" class="fullscreen-toggle" type="button" aria-label="Vollbild aktivieren">⛶ Vollbild</button>
  <canvas id="stars"></canvas>
  <canvas id="fractal" aria-label="Apfelmännchen Fraktal"></canvas>
  <div class="vignette"></div>

  <div class="hud">
    <div class="card">
      <div class="title">Apfelmännchen – Zoom-Reise</div>
      <div class="small">Startet sofort. Doppeltipp zoomt hinein. Zwei Finger zoomen und verschieben. Für die Kino-Version mit Ton gibt es unten einen Extra-Link.</div>
    </div>
    <div class="card controls">
      <button id="playPause" class="primary" type="button">⏸ Pause</button>
      <button id="reset" type="button">Reset</button>
      <button id="detail" class="secondary" type="button">Mehr Details</button>
      <button id="reroute" type="button">Neue Route</button>
      <div class="slider"><span>Tempo</span><input id="speed" type="range" min="0.2" max="2.2" step="0.05" value="1"></div>
      <a class="nav-link" href="kino.html">🎬 Kino-Version</a>
      <a class="nav-link" href="../">🏠 Spiele</a>
    </div>
  </div>

  <div class="bottom">
    <div class="card status" id="status">Berechne …</div>
    <div class="card"><span class="small">Rendern </span><progress id="progress" max="100" value="0"></progress></div>
  </div>

  <script>
    (() => {
      'use strict';
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
      }

      const starsCanvas = document.getElementById('stars');
      const fractalCanvas = document.getElementById('fractal');
      const sctx = starsCanvas.getContext('2d');
      const fctx = fractalCanvas.getContext('2d', { alpha: false });
      const progress = document.getElementById('progress');
      const statusEl = document.getElementById('status');
      const playPauseBtn = document.getElementById('playPause');
      const resetBtn = document.getElementById('reset');
      const detailBtn = document.getElementById('detail');
      const rerouteBtn = document.getElementById('reroute');
      const speedInput = document.getElementById('speed');
      const fullscreenToggle = document.getElementById('fullscreenToggle');

      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      const initialView = { centerX: -0.743643887037151, centerY: 0.13182590420533, scale: 0.0078, maxIter: 260 };
      const view = { ...initialView };
      let renderToken = 0;
      let animating = true;
      let routeT = 0;
      let lastFrame = performance.now();
      let dragging = false;
      let dragLast = null;
      const activePointers = new Map();
      let pinchBase = null;
      const stars = [];

      function resize() {
        document.body.classList.toggle('standalone', window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
        const w = Math.max(1, Math.floor(window.innerWidth * DPR));
        const h = Math.max(1, Math.floor(window.innerHeight * DPR));
        for (const c of [starsCanvas, fractalCanvas]) {
          c.width = w; c.height = h;
          c.style.width = window.innerWidth + 'px';
          c.style.height = window.innerHeight + 'px';
        }
        buildStars();
        renderFractal();
      }

      function buildStars() {
        stars.length = 0;
        const count = Math.floor((window.innerWidth * window.innerHeight) / 3600);
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * starsCanvas.width,
            y: Math.random() * starsCanvas.height,
            z: 0.2 + Math.random() * 0.8,
            r: 0.5 + Math.random() * 1.7,
            t: Math.random() * Math.PI * 2,
          });
        }
      }

      function drawStars(dt) {
        sctx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
        const drift = animating ? (0.015 + Number(speedInput.value) * 0.028) * dt : 0.01 * dt;
        for (const star of stars) {
          star.y += star.z * 20 * drift;
          if (star.y > starsCanvas.height + 3) {
            star.y = -3;
            star.x = Math.random() * starsCanvas.width;
          }
          star.t += dt * (0.001 + star.z * 0.003);
          const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(star.t));
          sctx.beginPath();
          sctx.fillStyle = `rgba(200,225,255,${0.12 + alpha * 0.68})`;
          sctx.arc(star.x, star.y, star.r * (0.75 + 0.35 * alpha), 0, Math.PI * 2);
          sctx.fill();
        }
      }

      function setStatus(extra = '') {
        const parts = [
          `Mitte: (${view.centerX.toFixed(12)}, ${view.centerY.toFixed(12)})`,
          `Breite: ${view.scale.toExponential(3)}`,
          `Iterationen: ${view.maxIter}`,
        ];
        if (extra) parts.push(extra);
        statusEl.textContent = parts.join(' · ');
      }

      function palette(iter, maxIter) {
        if (iter >= maxIter) return [0, 0, 0];
        const t = iter / maxIter;
        const glow = Math.pow(t, 0.28);
        const wave = (freq, phase) => 0.5 + 0.5 * Math.sin(6.28318 * (freq * t + phase));
        const r = Math.floor(18 + 130 * glow * wave(1.05, 0.05) + 80 * wave(2.2, 0.3));
        const g = Math.floor(20 + 120 * glow * wave(0.78, 0.42) + 92 * wave(1.6, 0.61));
        const b = Math.floor(38 + 170 * glow * wave(1.25, 0.72) + 40 * wave(2.8, 0.12));
        return [Math.min(255, r), Math.min(255, g), Math.min(255, b)];
      }

      function renderFractal() {
        const token = ++renderToken;
        progress.value = 0;
        setStatus('zeichne …');
        const width = fractalCanvas.width;
        const height = fractalCanvas.height;
        const aspect = height / width;
        const image = fctx.createImageData(width, height);
        const data = image.data;
        let y = 0;
        const rowsPerFrame = Math.max(3, Math.floor(10 / DPR));

        function chunk() {
          if (token !== renderToken) return;
          const yEnd = Math.min(height, y + rowsPerFrame);
          for (; y < yEnd; y++) {
            const ci = view.centerY + ((y / height) - 0.5) * view.scale * aspect;
            for (let x = 0; x < width; x++) {
              const cr = view.centerX + ((x / width) - 0.5) * view.scale;
              let zr = 0, zi = 0, iter = 0;
              while (zr * zr + zi * zi <= 4 && iter < view.maxIter) {
                const zr2 = zr * zr - zi * zi + cr;
                zi = 2 * zr * zi + ci;
                zr = zr2;
                iter++;
              }
              const idx = (y * width + x) * 4;
              const [r, g, b] = palette(iter, view.maxIter);
              data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
            }
          }
          progress.value = Math.round((y / height) * 100);
          if (y < height) requestAnimationFrame(chunk);
          else {
            fctx.putImageData(image, 0, 0);
            progress.value = 100;
            setStatus(animating ? 'automatische Reise läuft' : 'manuelle Ansicht');
          }
        }
        requestAnimationFrame(chunk);
      }

      function screenToComplex(x, y) {
        const width = fractalCanvas.width;
        const height = fractalCanvas.height;
        const aspect = height / width;
        return {
          x: view.centerX + ((x / width) - 0.5) * view.scale,
          y: view.centerY + ((y / height) - 0.5) * view.scale * aspect,
        };
      }

      function zoomAt(x, y, factor) {
        const before = screenToComplex(x, y);
        view.scale *= factor;
        const after = screenToComplex(x, y);
        view.centerX += before.x - after.x;
        view.centerY += before.y - after.y;
        renderFractal();
      }

      function newRoute() {
        routeT = Math.random() * Math.PI * 2;
        view.centerX = -0.743643887037151 + (Math.random() - 0.5) * 0.0018;
        view.centerY = 0.13182590420533 + (Math.random() - 0.5) * 0.0014;
        view.scale = 0.0074 + Math.random() * 0.0014;
        view.maxIter = 260;
        renderFractal();
      }

      function updateJourney(dt) {
        if (!animating || dragging || activePointers.size >= 2) return;
        const speed = Number(speedInput.value);
        routeT += dt * (0.45 + speed * 0.48);
        const swirl = view.scale * (0.045 + 0.01 * Math.sin(routeT * 0.8));
        view.centerX += Math.cos(routeT * 0.76) * swirl * dt * 8.5;
        view.centerY += Math.sin(routeT * 1.11) * swirl * dt * 8.5;
        view.scale *= Math.pow(0.9885, speed * 60 * dt);
        const targetIter = Math.min(2200, Math.round(210 + 46 * Math.log10(1 / view.scale)));
        if (targetIter > view.maxIter) view.maxIter = targetIter;
        if (view.scale < 5e-11) newRoute();
        else renderFractal();
      }

      function pointerXY(event) {
        const rect = fractalCanvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) * DPR, y: (event.clientY - rect.top) * DPR };
      }

      function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
      function stopAuto() { animating = false; playPauseBtn.textContent = '▶ Reise starten'; }

      fractalCanvas.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        fractalCanvas.setPointerCapture(event.pointerId);
        const p = pointerXY(event);
        activePointers.set(event.pointerId, p);
        stopAuto();
        if (activePointers.size === 1) {
          dragging = true; dragLast = p;
        } else if (activePointers.size === 2) {
          const [a, b] = [...activePointers.values()];
          pinchBase = { dist: distance(a, b), mid: midpoint(a, b), scale: view.scale };
        }
      });

      fractalCanvas.addEventListener('pointermove', (event) => {
        if (!activePointers.has(event.pointerId)) return;
        event.preventDefault();
        const p = pointerXY(event);
        activePointers.set(event.pointerId, p);
        if (activePointers.size === 1 && dragging && dragLast) {
          const dx = p.x - dragLast.x;
          const dy = p.y - dragLast.y;
          view.centerX -= (dx / fractalCanvas.width) * view.scale;
          view.centerY -= (dy / fractalCanvas.height) * view.scale * (fractalCanvas.height / fractalCanvas.width);
          dragLast = p;
          renderFractal();
        } else if (activePointers.size === 2 && pinchBase) {
          const [a, b] = [...activePointers.values()];
          const d = Math.max(6, distance(a, b));
          const mid = midpoint(a, b);
          const factor = pinchBase.dist / d;
          view.scale = pinchBase.scale * factor;
          const before = screenToComplex(pinchBase.mid.x, pinchBase.mid.y);
          const after = screenToComplex(mid.x, mid.y);
          view.centerX += before.x - after.x;
          view.centerY += before.y - after.y;
          renderFractal();
        }
      });

      function releasePointer(event) {
        if (!activePointers.has(event.pointerId)) return;
        activePointers.delete(event.pointerId);
        dragging = false; dragLast = null; pinchBase = null;
      }
      fractalCanvas.addEventListener('pointerup', releasePointer);
      fractalCanvas.addEventListener('pointercancel', releasePointer);
      fractalCanvas.addEventListener('pointerleave', releasePointer);

      fractalCanvas.addEventListener('dblclick', (event) => {
        stopAuto();
        const p = pointerXY(event);
        zoomAt(p.x, p.y, 0.34);
      });

      let lastTap = 0;
      fractalCanvas.addEventListener('pointerup', (event) => {
        if (event.pointerType !== 'touch') return;
        const now = performance.now();
        if (now - lastTap < 280) {
          const p = pointerXY(event);
          stopAuto();
          zoomAt(p.x, p.y, 0.34);
          lastTap = 0;
        } else lastTap = now;
      });

      fractalCanvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        stopAuto();
        const p = pointerXY(event);
        zoomAt(p.x, p.y, event.deltaY < 0 ? 0.78 : 1.3);
      }, { passive: false });

      document.addEventListener('contextmenu', event => {
        if (event.target.closest('canvas, button, .nav-link')) event.preventDefault();
      }, { passive: false });
      document.addEventListener('selectstart', event => {
        if (event.target.closest('canvas, button, .nav-link')) event.preventDefault();
      }, { passive: false });

      playPauseBtn.addEventListener('click', () => {
        animating = !animating;
        playPauseBtn.textContent = animating ? '⏸ Pause' : '▶ Reise starten';
        renderFractal();
      });
      resetBtn.addEventListener('click', () => {
        Object.assign(view, initialView);
        animating = true;
        playPauseBtn.textContent = '⏸ Pause';
        renderFractal();
      });
      detailBtn.addEventListener('click', () => {
        view.maxIter = Math.min(2400, Math.round(view.maxIter * 1.35));
        stopAuto();
        renderFractal();
      });
      rerouteBtn.addEventListener('click', () => {
        animating = true;
        playPauseBtn.textContent = '⏸ Pause';
        newRoute();
      });
      fullscreenToggle.addEventListener('click', async () => {
        const root = document.documentElement;
        try {
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          } else if (root.requestFullscreen) {
            await root.requestFullscreen();
          } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
          }
        } catch {}
      });

      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', () => setTimeout(resize, 120));

      function frame(now) {
        const dt = Math.min(50, now - lastFrame);
        lastFrame = now;
        drawStars(dt);
        updateJourney(dt / 1000);
        requestAnimationFrame(frame);
      }

      resize();
      requestAnimationFrame((t) => { lastFrame = t; frame(t); });
    })();
  </script>
</body>
</html>
