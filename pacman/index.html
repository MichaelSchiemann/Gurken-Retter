<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Punktjäger" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050816" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>Punktjäger</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050816; color: #fff6c7; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
    body::before { content:""; position: fixed; inset:0; pointer-events:none; background: radial-gradient(circle at 50% -10%, rgba(67,94,255,.35), transparent 38%), radial-gradient(circle at 80% 85%, rgba(255,204,0,.14), transparent 35%); }
    #game { display:block; width:100vw; height:100dvh; }
    .hud { position: fixed; z-index: 3; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); display:flex; justify-content:space-between; gap:8px; pointer-events:none; }
    .pill { min-width: 82px; text-align:center; padding: 8px 10px; border-radius: 999px; border:1px solid rgba(255,255,255,.16); background: rgba(9,14,42,.62); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.25); font-weight: 900; letter-spacing:.2px; }
    #overlay { position:fixed; inset:0; z-index: 5; display:grid; place-items:center; padding: 24px; background: radial-gradient(circle at 50% 32%, rgba(29,42,122,.92), rgba(2,4,15,.96)); }
    .card { width:min(440px, 94vw); text-align:center; padding: 28px 22px 22px; border-radius: 30px; background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.055)); border:1px solid rgba(255,255,255,.18); box-shadow: 0 30px 90px rgba(0,0,0,.5); backdrop-filter: blur(16px); }
    h1 { margin: 8px 0 6px; font-size: clamp(42px, 13vw, 64px); line-height:.9; letter-spacing:-2px; color:#ffe45e; text-shadow: 0 0 22px rgba(255,226,73,.36); }
    .mascot { font-size: 68px; filter: drop-shadow(0 12px 20px rgba(0,0,0,.35)); }
    p { margin: 13px auto; line-height:1.42; max-width: 33ch; opacity:.92; }
    .hint { opacity:.72; font-size:14px; }
    button { appearance:none; border:0; border-radius:999px; padding:15px 24px; margin-top:10px; background:linear-gradient(180deg,#fff176,#ffc400); color:#161000; font-size:18px; font-weight:950; box-shadow:0 12px 0 #9f7600, 0 24px 44px rgba(0,0,0,.35); }
    button:active { transform:translateY(6px); box-shadow:0 6px 0 #9f7600, 0 16px 32px rgba(0,0,0,.35); }
    .controls { position:fixed; z-index:4; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:176px; height:130px; opacity:.72; }
    .pad { position:absolute; width:54px; height:54px; border-radius:18px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08); color:#fff6c7; font-size:26px; display:grid; place-items:center; user-select:none; backdrop-filter: blur(10px); }
    .pad:active { background:rgba(255,228,94,.24); transform:scale(.96); }
    #up{left:61px;top:0} #left{left:0;top:56px} #right{right:0;top:56px} #down{left:61px;bottom:0}
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Punktjäger Spiel"></canvas>
  <div class="hud">
    <div class="pill">● <span id="score">0</span></div>
    <div class="pill">♥ <span id="lives">3</span></div>
    <div class="pill">🏆 <span id="best">0</span></div>
  </div>
  <div class="controls" aria-label="Steuerung">
    <div class="pad" id="up">▲</div><div class="pad" id="left">◀</div><div class="pad" id="right">▶</div><div class="pad" id="down">▼</div>
  </div>
  <div id="overlay">
    <div class="card">
      <div class="mascot">🟡</div>
      <h1>Punkt-<br>jäger</h1>
      <p>Eine klassische Labyrinth-Jagd fürs iPhone: Punkte fressen, Geistern ausweichen, Powerpunkte nutzen.</p>
      <button id="start">Spiel starten</button>
      <p class="hint">Steuerung per Wischgeste oder Steuerkreuz. Ton startet nach dem ersten Tippen.</p>
    </div>
  </div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const $score = document.getElementById('score'), $lives = document.getElementById('lives'), $best = document.getElementById('best');
  const overlay = document.getElementById('overlay'), startButton = document.getElementById('start');
  const storeKey = 'punktjaeger-best-v1';
  let best = Number(localStorage.getItem(storeKey) || 0); $best.textContent = best;
  const DIRS = {left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1}};
  const OPP = {left:'right', right:'left', up:'down', down:'up'};
  const MAP = [
    '###############',
    '#P....#....o..#',
    '#.###.#.###.#.#',
    '#o#.......#.#.#',
    '#.###.###.#...#',
    '#.....#.......#',
    '###.#.#.#.###.#',
    '#...#...#...#.#',
    '#.#####G###.#.#',
    '#.............#',
    '#.###.#.#.###.#',
    '#o..#.#.#...o.#',
    '###.#.#.###.#.#',
    '#.....#.......#',
    '#.###.###.###.#',
    '#.............#',
    '###############'
  ];
  const state = { w:0,h:0,dpr:1,tile:20,ox:0,oy:80, running:false, paused:false, over:false, score:0,lives:3,level:1,last:0,time:0, pellets:0, frightened:0, grid:[], player:null, ghosts:[], particles:[], mouth:0, touch:null, audio:null, muted:false };

  function resize(){ state.dpr=Math.min(devicePixelRatio||1,2); state.w=innerWidth; state.h=innerHeight; canvas.width=Math.floor(state.w*state.dpr); canvas.height=Math.floor(state.h*state.dpr); canvas.style.width=state.w+'px'; canvas.style.height=state.h+'px'; ctx.setTransform(state.dpr,0,0,state.dpr,0,0); const rows=MAP.length, cols=MAP[0].length; const usableH=state.h-210-Math.max(0, (window.safeAreaInsetBottom||0)); state.tile=Math.floor(Math.min((state.w-24)/cols, usableH/rows)); state.tile=Math.max(18, state.tile); state.ox=(state.w-state.tile*cols)/2; state.oy=Math.max(58, (state.h-state.tile*rows-130)/2); }
  function cloneLevel(){ state.grid=MAP.map(r=>r.split('')); state.pellets=0; let spawn={x:7,y:8}; for(let y=0;y<state.grid.length;y++) for(let x=0;x<state.grid[y].length;x++){ const c=state.grid[y][x]; if(c==='.'||c==='o') state.pellets++; if(c==='P'){ state.player=entity(x,y,'right',5.6); state.grid[y][x]=' '; } if(c==='G'){ spawn={x,y}; state.grid[y][x]=' '; }} state.ghosts=[entity(spawn.x,spawn.y,'left',4.15,'#ff4d6d'), entity(spawn.x-1,spawn.y,'up',3.95,'#4ddcff'), entity(spawn.x+1,spawn.y,'down',3.85,'#ff9f43')]; }
  function entity(x,y,dir,speed,color){ return {x:x+.5,y:y+.5,spawnX:x+.5,spawnY:y+.5,dir,next:dir,speed,color,dead:0}; }
  function resetAll(){ state.score=0; state.lives=3; state.level=1; state.frightened=0; state.running=true; state.over=false; state.particles=[]; cloneLevel(); updateHud(); overlay.classList.add('hidden'); sound('start'); }
  function updateHud(){ $score.textContent=state.score; $lives.textContent=state.lives; if(state.score>best){best=state.score; localStorage.setItem(storeKey,String(best));} $best.textContent=best; }
  function wall(x,y){ x=Math.floor(x); y=Math.floor(y); return y<0||y>=state.grid.length||x<0||x>=state.grid[0].length||state.grid[y][x]==='#'; }
  function centered(e){ return Math.abs(e.x-(Math.floor(e.x)+.5))<.085 && Math.abs(e.y-(Math.floor(e.y)+.5))<.085; }
  function can(e,dir){ const d=DIRS[dir]; return !wall(Math.floor(e.x)+d.x, Math.floor(e.y)+d.y); }
  function move(e,dt){ if(e.dead>0){ e.dead-=dt; return; } if(centered(e)){ e.x=Math.floor(e.x)+.5; e.y=Math.floor(e.y)+.5; if(can(e,e.next)) e.dir=e.next; if(!can(e,e.dir)) return; } const d=DIRS[e.dir]; e.x+=d.x*e.speed*dt; e.y+=d.y*e.speed*dt; }
  function setDir(d){ if(!state.player) return; state.player.next=d; }
  function updatePlayer(dt){ const p=state.player; p.speed=5.55+Math.min(1.15,state.level*.12); move(p,dt); const tx=Math.floor(p.x), ty=Math.floor(p.y), c=state.grid[ty]?.[tx]; if((c==='.'||c==='o') && Math.abs(p.x-(tx+.5))<.35 && Math.abs(p.y-(ty+.5))<.35){ state.grid[ty][tx]=' '; state.pellets--; state.score += c==='o' ? 50 : 10; burst(p.x,p.y,c==='o'?'#7cf8ff':'#ffe45e',c==='o'?18:5); sound(c==='o'?'power':'dot'); if(c==='o') state.frightened=8.5; updateHud(); if(state.pellets<=0) nextLevel(); }}
  function nextLevel(){ state.level++; state.score+=250; sound('win'); cloneLevel(); updateHud(); }
  function updateGhosts(dt){ state.frightened=Math.max(0,state.frightened-dt); for(const g of state.ghosts){ if(centered(g)){ g.x=Math.floor(g.x)+.5; g.y=Math.floor(g.y)+.5; const options=Object.keys(DIRS).filter(d=>d!==OPP[g.dir] && can(g,d)); const dirs=options.length?options:Object.keys(DIRS).filter(d=>can(g,d)); if(dirs.length){ if(state.frightened>0) g.next=dirs[Math.floor(Math.random()*dirs.length)]; else { const p=state.player; dirs.sort((a,b)=>{ const da=DIRS[a], db=DIRS[b]; const ax=g.x+da.x-p.x, ay=g.y+da.y-p.y, bx=g.x+db.x-p.x, by=g.y+db.y-p.y; return (ax*ax+ay*ay)-(bx*bx+by*by); }); g.next=dirs[0]; } } } g.speed=(state.frightened>0?2.75:3.6+state.level*.18); move(g,dt); const dx=g.x-state.player.x, dy=g.y-state.player.y; if(dx*dx+dy*dy<.34){ if(state.frightened>0){ state.score+=200; g.x=g.spawnX; g.y=g.spawnY; g.dead=.7; burst(g.x,g.y,'#a6f7ff',22); sound('eatGhost'); updateHud(); } else if(g.dead<=0) loseLife(); } }}
  function loseLife(){ state.lives--; sound('death'); navigator.vibrate?.([80,40,120]); updateHud(); if(state.lives<=0){ state.running=false; state.over=true; overlay.querySelector('.mascot').textContent='👻'; overlay.querySelector('h1').innerHTML='Spiel<br>vorbei'; overlay.querySelector('p').textContent=`Du hast ${state.score} Punkte gejagt. Rekord: ${best}.`; startButton.textContent='Noch mal spielen'; overlay.classList.remove('hidden'); } else { const oldScore=state.score; cloneLevel(); state.score=oldScore; }}
  function burst(gx,gy,color,n){ const p=toPx(gx,gy); for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=35+Math.random()*110; state.particles.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.45,color,r:1.5+Math.random()*2.5}); }}
  function updateParticles(dt){ for(let i=state.particles.length-1;i>=0;i--){ const p=state.particles[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.98; p.vy*=.98; if(p.life<=0) state.particles.splice(i,1); }}
  function update(dt){ if(!state.running) return; state.time+=dt; state.mouth=(Math.sin(state.time*12)+1)/2; updatePlayer(dt); updateGhosts(dt); updateParticles(dt); }
  function toPx(x,y){ return {x:state.ox+x*state.tile, y:state.oy+y*state.tile}; }
  function draw(){ const grd=ctx.createLinearGradient(0,0,0,state.h); grd.addColorStop(0,'#050816'); grd.addColorStop(1,'#09051c'); ctx.fillStyle=grd; ctx.fillRect(0,0,state.w,state.h); drawMaze(); drawEntities(); drawParticles(); if(state.running && state.frightened>0) drawPowerBar(); }
  function drawMaze(){ const t=state.tile; ctx.save(); ctx.translate(state.ox,state.oy); ctx.lineJoin='round'; for(let y=0;y<state.grid.length;y++) for(let x=0;x<state.grid[y].length;x++){ const c=state.grid[y][x]; if(c==='#'){ const pulse=.55+.15*Math.sin(state.time*2+x*.7+y*.3); ctx.fillStyle=`rgba(34,86,255,${pulse})`; roundRect(x*t+2,y*t+2,t-4,t-4,7); ctx.fill(); ctx.strokeStyle='rgba(117,194,255,.45)'; ctx.lineWidth=1; ctx.stroke(); } else if(c==='.'||c==='o'){ ctx.fillStyle=c==='o'?'#7cf8ff':'#ffeec2'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=c==='o'?16:5; ctx.beginPath(); ctx.arc((x+.5)*t,(y+.5)*t,c==='o'?t*.18:t*.07,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }} ctx.restore(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function drawEntities(){ const p=toPx(state.player.x,state.player.y), t=state.tile; const angle={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[state.player.dir]; const open=.2+state.mouth*.55; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(angle); ctx.fillStyle='#ffe45e'; ctx.shadowColor='#ffe45e'; ctx.shadowBlur=18; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,t*.42,open,Math.PI*2-open); ctx.closePath(); ctx.fill(); ctx.restore(); ctx.shadowBlur=0; for(const g of state.ghosts) drawGhost(g); }
  function drawGhost(g){ const p=toPx(g.x,g.y), t=state.tile, scared=state.frightened>0; ctx.save(); ctx.translate(p.x,p.y); ctx.fillStyle=scared?'#244dff':g.color; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(0,-t*.06,t*.34,Math.PI,0); ctx.lineTo(t*.34,t*.28); for(let i=2;i>=-2;i--) ctx.lineTo(i*t*.17, t*(i%2? .18:.30)); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-t*.13,-t*.08,t*.08,0,7); ctx.arc(t*.13,-t*.08,t*.08,0,7); ctx.fill(); ctx.fillStyle=scared?'#fff':'#111'; ctx.beginPath(); ctx.arc(-t*.13,-t*.08,t*.035,0,7); ctx.arc(t*.13,-t*.08,t*.035,0,7); ctx.fill(); ctx.restore(); }
  function drawParticles(){ for(const p of state.particles){ ctx.globalAlpha=Math.max(0,p.life/.8); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } ctx.globalAlpha=1; }
  function drawPowerBar(){ ctx.fillStyle='rgba(124,248,255,.18)'; ctx.fillRect(state.ox,state.oy-12,state.tile*MAP[0].length,5); ctx.fillStyle='#7cf8ff'; ctx.fillRect(state.ox,state.oy-12,state.tile*MAP[0].length*(state.frightened/8.5),5); }
  function loop(now){ const dt=Math.min(.033,(now-state.last)/1000||.016); state.last=now; update(dt); draw(); requestAnimationFrame(loop); }
  function initAudio(){ if(state.audio) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; state.audio=new AC(); }
  function tone(freq,dur=.055,type='square',gain=.035){ if(!state.audio||state.muted) return; const t=state.audio.currentTime, o=state.audio.createOscillator(), g=state.audio.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(state.audio.destination); o.start(t); o.stop(t+dur); }
  function sound(name){ initAudio(); if(state.audio?.state==='suspended') state.audio.resume(); if(name==='dot') tone(520+Math.random()*60,.035,'square',.025); if(name==='power'){ [330,440,660].forEach((f,i)=>setTimeout(()=>tone(f,.09,'sawtooth',.04),i*55)); } if(name==='eatGhost') tone(180,.14,'triangle',.06); if(name==='death'){ [300,220,150,90].forEach((f,i)=>setTimeout(()=>tone(f,.14,'sawtooth',.05),i*95)); } if(name==='start') [392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,.11,'triangle',.045),i*80)); if(name==='win') [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.09,'triangle',.05),i*70)); }
  function pointerStart(e){ state.touch={x:e.clientX,y:e.clientY}; }
  function pointerMove(e){ if(!state.touch) return; const dx=e.clientX-state.touch.x, dy=e.clientY-state.touch.y; if(Math.max(Math.abs(dx),Math.abs(dy))>22){ setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); state.touch={x:e.clientX,y:e.clientY}; }}
  canvas.addEventListener('pointerdown', pointerStart); canvas.addEventListener('pointermove', pointerMove); canvas.addEventListener('pointerup',()=>state.touch=null); canvas.addEventListener('pointercancel',()=>state.touch=null);
  for(const id of ['up','down','left','right']) document.getElementById(id).addEventListener('pointerdown', e=>{ e.preventDefault(); initAudio(); setDir(id); });
  addEventListener('keydown', e=>{ const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key]; if(k) setDir(k); if(e.key==='Enter'||e.key===' ') resetAll(); });
  startButton.addEventListener('click',()=>{ initAudio(); resetAll(); }); addEventListener('resize', resize);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  resize(); cloneLevel(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
