<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=overlays-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gurken-Sprung" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12351f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>Gurken-Sprung</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#73d2de;color:#f7fff0;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}#game{display:block;width:100vw;height:100dvh}.hud{position:fixed;z-index:4;top:max(9px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:7px;pointer-events:none}.pill{padding:8px 10px;border-radius:999px;background:rgba(18,53,31,.58);border:1px solid rgba(255,255,255,.24);box-shadow:0 9px 24px rgba(0,0,0,.18);backdrop-filter:blur(10px);font-weight:950;min-width:52px;text-align:center}#mute{pointer-events:auto}.top-nav{position:fixed;z-index:6;right:max(10px,env(safe-area-inset-right));top:calc(max(9px,env(safe-area-inset-top)) + 48px);display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:94vw}.top-nav a{color:#0b2b16;text-decoration:none;font-weight:950;font-size:12px;padding:7px 8px;border-radius:999px;background:rgba(247,255,240,.86);box-shadow:0 7px 18px rgba(0,0,0,.2)}.controls{position:fixed;z-index:5;bottom:max(14px,env(safe-area-inset-bottom));left:max(13px,env(safe-area-inset-left));right:max(13px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;pointer-events:none}.touch{pointer-events:auto;min-height:68px;border:1px solid rgba(255,255,255,.25);border-radius:25px;background:rgba(18,53,31,.46);color:#f7fff0;font-size:29px;font-weight:950;box-shadow:0 12px 26px rgba(0,0,0,.22)}#overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 30%,rgba(74,222,128,.78),rgba(9,30,19,.95))}.card{width:min(450px,94vw);padding:26px 22px 20px;text-align:center;border-radius:30px;border:1px solid rgba(255,255,255,.24);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:0 26px 80px rgba(0,0,0,.38);backdrop-filter:blur(16px)}h1{margin:0;font-size:clamp(38px,11vw,58px);line-height:.95}p{line-height:1.45;opacity:.92;margin:14px auto;max-width:34ch}button{appearance:none;border:0;border-radius:999px;padding:14px 22px;margin:7px 5px 0;font-size:17px;font-weight:950;color:#0b2b16;background:linear-gradient(180deg,#fff7b0,#ffd166);box-shadow:0 10px 0 #b87715,0 20px 34px rgba(0,0,0,.32)}.small{font-size:14px;opacity:.72}.hidden{display:none!important}

    .fullscreen-toggle { position:fixed; z-index:8; left:max(12px,env(safe-area-inset-left)); top:calc(max(10px,env(safe-area-inset-top)) + 48px); padding:8px 11px; min-height:0; border-radius:999px; border:1px solid rgba(255,255,255,.22); background:rgba(245,255,245,.88); color:#061526; font-size:12px; font-weight:950; line-height:1; box-shadow:0 7px 18px rgba(0,0,0,.22); }
    .fullscreen-toggle:active { transform:translateY(2px); }
    .standalone .fullscreen-toggle { display:none; }
    @media all and (display-mode: fullscreen), all and (display-mode: standalone) { .fullscreen-toggle { display:none; } }
  
    /* Prevent iPhone/Safari from selecting labels on game controls. */
    html, body, canvas, button, .touch, .ctrl, .pad, .game-btn, .fullscreen-toggle, .controls {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-user-drag: none;
      touch-action: none;
    }
    button, .touch, .ctrl, .pad, .game-btn, .fullscreen-toggle {
      cursor: pointer; -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <button id="fullscreenToggle" class="fullscreen-toggle" type="button" aria-label="Vollbild aktivieren">⛶ Vollbild</button>
  <canvas id="game" aria-label="Gurken-Sprung Jump and Run"></canvas>
  <div class="hud"><div class="pill">🥒 <span id="score">0</span></div><div class="pill">W<span id="world">1</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">🏆 <span id="best">0</span></div><div class="pill" id="mute">🔊</div></div>
  <nav class="top-nav" aria-label="Spielesammlung"><a href="../">🥒 Retter</a><a href="../pacman/">🟡 Punktjäger</a><a href="../tetris/">🧱 Stapler</a><a href="../breakout/">💥 Breaker</a></nav>
  <div class="controls"><button class="touch" id="left">◀</button><button class="touch" id="right">▶</button><button class="touch" id="jumpBtn">SPRUNG</button></div>
  <div id="overlay"><div class="card"><div style="font-size:64px">🥒🏃</div><h1>Gurken-<br>Sprung</h1><p id="intro">Springe über Schnecken, sammle Gurken und erreiche die Flagge. Drei kurze Welten für die erste Version.</p><button id="start">Spiel starten</button><p class="small">iPhone: Links/rechts halten und SPRUNG tippen. Am Rechner: Pfeile/WASD + Leertaste.</p></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),x=c.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);const ui={score:$('score'),world:$('world'),lives:$('lives'),best:$('best'),mute:$('mute'),overlay:$('overlay'),intro:$('intro'),start:$('start'),left:$('left'),right:$('right'),jump:$('jumpBtn')};let W=0,H=0,d=1,cam=0,run=false,muted=localStorage.getItem('jump-muted')==='1',best=+localStorage.getItem('jump-best')||0,score=0,lives=3,world=0,audio=null,music=null,keys={left:false,right:false,jump:false},parts=[];ui.best.textContent=best;ui.mute.textContent=muted?'🔇':'🔊';
const levels=[{name:'Gurkenwiese',w:2600,spawn:[80,250],flag:2470,p:[[0,500,760,70],[860,440,210,28],[1160,380,190,28],[1450,485,360,70],[1900,420,190,28],[2170,360,180,28],[2380,500,260,70]],coins:[[320,455],[500,455],[910,395],[1210,335],[1510,440],[1990,375],[2210,315]],en:[[650,468,120],[1540,453,220],[2380,468,170]],sp:[]},{name:'Brückenwald',w:2900,spawn:[70,220],flag:2740,p:[[0,510,620,70],[720,455,160,28],[980,395,160,28],[1240,335,170,28],[1540,505,390,70],[2040,440,160,28],[2300,380,180,28],[2580,510,340,70]],coins:[[250,465],[760,410],[1035,350],[1300,290],[1640,460],[2110,395],[2360,335],[2650,465]],en:[[360,478,170],[1590,473,250],[2585,478,200]],sp:[]},{name:'Schlossgarten',w:3200,spawn:[70,230],flag:3050,p:[[0,520,540,70],[650,455,150,28],[910,390,150,28],[1140,325,150,28],[1450,500,300,70],[1870,430,160,28],[2100,365,160,28],[2360,300,160,28],[2660,520,560,70]],coins:[[230,475],[690,410],[955,345],[1185,280],[1510,455],[1930,385],[2160,320],[2415,255],[2850,475]],en:[[300,488,155],[1480,468,210],[2670,488,260]],sp:[[1720,480],[2530,280]]}];
const pl={x:80,y:260,w:28,h:38,vx:0,vy:0,g:false,inv:0};function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}function beep(f=440,t=.07,type='sine',g=.035){if(muted)return;audio||=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),n=audio.createGain();o.type=type;o.frequency.value=f;n.gain.value=g;o.connect(n);n.connect(audio.destination);o.start();n.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+t);o.stop(audio.currentTime+t)}function startMusic(){if(muted||music)return;let ns=[262,330,392,523,392,330],i=0;music=setInterval(()=>beep(ns[i++%ns.length],.08,'triangle',.015),430)}function stopMusic(){clearInterval(music);music=null}
function reset(keep=true){let l=levels[world];[pl.x,pl.y]=l.spawn;pl.vx=pl.vy=0;pl.inv=80;cam=0;l.cs=l.coins.map(a=>[...a,false]);l.es=l.en.map(e=>({x:e[0],base:e[0],range:e[2],vx:1.1+world*.22,w:30,h:24,alive:true}));if(!keep)score=0;hud()}function hud(){ui.score.textContent=score;ui.world.textContent=world+1;ui.lives.textContent=lives;ui.best.textContent=best}function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function ground(px){let y=H+200;for(const p of levels[world].p)if(px>=p[0]&&px<=p[0]+p[2])y=Math.min(y,p[1]);return y}function burst(px,py,col){for(let i=0;i<9;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*4,vy:(Math.random()-.8)*4,life:28,col})}function damage(){if(pl.inv>0)return;lives--;beep(120,.18,'sawtooth');pl.inv=90;if(lives<=0)return over();reset(true)}function over(win=false){run=false;stopMusic();if(score>best){best=score;localStorage.setItem('jump-best',best)}hud();ui.overlay.classList.remove('hidden');ui.intro.textContent=win?`Alle Welten geschafft! ${score} Punkte.`:`Spiel vorbei: ${score} Punkte. Nochmal springen?`}
function collide(axis){for(const p of levels[world].p){let r={x:p[0],y:p[1],w:p[2],h:p[3]};if(!rect(pl,r))continue;if(axis==='x'){if(pl.vx>0)pl.x=r.x-pl.w;else if(pl.vx<0)pl.x=r.x+r.w;pl.vx=0}else{if(pl.vy>0){pl.y=r.y-pl.h;pl.vy=0;pl.g=true}else if(pl.vy<0){pl.y=r.y+r.h;pl.vy=0}}}}
function step(){let l=levels[world],a=(keys.right?1:0)-(keys.left?1:0);if(pl.inv>0)pl.inv--;pl.vx=(pl.vx+a*.75)*.82;pl.vx=Math.max(-6,Math.min(6,pl.vx));if(keys.jump&&pl.g){pl.vy=-13.4;pl.g=false;beep(520,.08,'square')}keys.jump=false;pl.vy=Math.min(15,pl.vy+.72);pl.x+=pl.vx;collide('x');pl.y+=pl.vy;pl.g=false;collide('y');pl.x=Math.max(0,Math.min(l.w-pl.w,pl.x));if(pl.y>H+220)damage();for(const e of l.es){if(!e.alive)continue;e.x+=e.vx;if(e.x<e.base||e.x>e.base+e.range)e.vx*=-1;e.y=ground(e.x+15)-e.h;if(rect(pl,e)){if(pl.vy>2&&pl.y+pl.h-e.y<18){e.alive=false;pl.vy=-9;score+=80;burst(e.x+15,e.y,'#ffd166');beep(760,.08,'square')}else damage()}}for(const co of l.cs){if(co[2])continue;let r={x:co[0]-12,y:co[1]-12,w:24,h:24};if(rect(pl,r)){co[2]=true;score+=25;burst(co[0],co[1],'#ffd166');beep(900,.06);hud()}}for(const s of l.sp){let r={x:s[0],y:s[1],w:36,h:16};if(rect(pl,r)&&pl.vy>0){pl.vy=-18;score+=15;burst(s[0]+18,s[1],'#70f4a7');beep(980,.12,'triangle');hud()}}if(pl.x>l.flag){score+=250+world*100;if(world<levels.length-1){world++;beep(880,.18,'triangle');reset(true)}else over(true)}parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.life--});parts=parts.filter(p=>p.life>0);cam=Math.max(0,Math.min(l.w-W,pl.x-W*.42));hud()}
function rr(a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h);x.fill()}function draw(){let l=levels[world];let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#73d2de');g.addColorStop(.62,'#d6fff5');g.addColorStop(1,'#267a42');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(-cam,0);for(const p of l.p){x.fillStyle='#7c4f24';rr(p[0],p[1],p[2],p[3],10);x.fillStyle='#4ade80';rr(p[0],p[1],p[2],14,10)}for(const s of l.sp){x.fillStyle='#f72585';rr(s[0],s[1],36,16,8)}for(const co of l.cs||[]){if(co[2])continue;x.fillStyle='#ffd166';x.beginPath();x.arc(co[0],co[1],12,0,7);x.fill();x.font='900 14px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('🥒',co[0],co[1]+1)}for(const e of l.es||[]){if(!e.alive)continue;x.fillStyle='#8b5cf6';rr(e.x,e.y,e.w,e.h,12);x.fillStyle='#fff';x.beginPath();x.arc(e.x+9,e.y+8,3,0,7);x.arc(e.x+21,e.y+8,3,0,7);x.fill()}x.fillStyle='#ef476f';x.fillRect(l.flag,270,7,230);x.fillStyle='#ffd166';x.beginPath();x.moveTo(l.flag+7,270);x.lineTo(l.flag+82,295);x.lineTo(l.flag+7,320);x.fill();x.globalAlpha=pl.inv%12<6?1:.45;x.fillStyle='#2dd36f';rr(pl.x,pl.y,pl.w,pl.h,13);x.globalAlpha=1;x.font='900 22px system-ui';x.textAlign='center';x.fillText('🥒',pl.x+pl.w/2,pl.y+25);for(const p of parts){x.globalAlpha=Math.max(0,p.life/28);x.fillStyle=p.col;x.fillRect(p.x,p.y,4,4)}x.restore();x.globalAlpha=1;x.fillStyle='rgba(18,53,31,.75)';x.font='900 14px system-ui';x.textAlign='center';x.fillText(l.name,W/2,88)}function loop(){if(!run)return;step();draw();requestAnimationFrame(loop)}
ui.start.onclick=()=>{audio||=new(window.AudioContext||window.webkitAudioContext)();score=0;lives=3;world=0;run=true;ui.overlay.classList.add('hidden');reset(false);startMusic();requestAnimationFrame(loop)};ui.mute.onclick=()=>{muted=!muted;localStorage.setItem('jump-muted',muted?'1':'0');ui.mute.textContent=muted?'🔇':'🔊';muted?stopMusic():run&&startMusic()};for(const [el,k]of[[ui.left,'left'],[ui.right,'right']]){el.onpointerdown=()=>keys[k]=true;el.onpointerup=el.onpointercancel=el.onpointerleave=()=>keys[k]=false}ui.jump.onpointerdown=()=>keys.jump=true;c.onpointerdown=()=>keys.jump=true;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w'){e.preventDefault();keys.jump=true}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',resize);resize();reset(false);draw();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});

  function setupFullscreenButton(){
    const btn = document.getElementById('fullscreenToggle');
    if(!btn) return;
    const standalone = matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if(standalone){ document.documentElement.classList.add('standalone'); btn.hidden = true; return; }
    const request = () => {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if(fn){ Promise.resolve(fn.call(el)).catch(()=>{}); btn.textContent = '✓ Vollbild'; }
      else { btn.textContent = 'Zum Home-Bildschirm'; setTimeout(()=>{ btn.textContent='⛶ Vollbild'; }, 2400); }
    };
    btn.addEventListener('click', request);
  }
  setupFullscreenButton();
})();

  function lockGameControlSelection(){
    document.addEventListener('selectstart', e=>{
      if(e.target.closest && e.target.closest('button,.controls,.pad,.touch,.ctrl,.game-btn,.fullscreen-toggle,canvas')) e.preventDefault();
    }, {passive:false});
    document.addEventListener('contextmenu', e=>{
      if(e.target.closest && e.target.closest('button,.controls,.pad,.touch,.ctrl,.game-btn,.fullscreen-toggle,canvas')) e.preventDefault();
    }, {passive:false});
    document.querySelectorAll('button,.pad,.touch,.ctrl,.game-btn,.fullscreen-toggle').forEach(el=>{
      el.setAttribute('draggable','false');
      el.addEventListener('pointerdown', e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false});
    });
  }
  lockGameControlSelection();

</script>
</body>
</html>
